name: Build and Deploy to Azure Container App

on:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -f src/Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/techworkshop-app:${{ github.sha }} \
            src/

      - name: Push Docker image to ACR
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/techworkshop-app:${{ github.sha }}

      - name: Set Container App secrets
        run: |
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --secrets \
              foundry-endpoint=${{ secrets.FOUNDRY_ENDPOINT }} \
              gpt-endpoint=${{ secrets.gpt_endpoint }} \
              embedding-endpoint=${{ secrets.embedding_endpoint }} \
              phi-4-endpoint=${{ secrets.phi_4_endpoint }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/techworkshop-app:${{ github.sha }} \
            --set-env-vars \
              FOUNDRY_ENDPOINT=secretref:foundry-endpoint \
              gpt_endpoint=secretref:gpt-endpoint \
              embedding_endpoint=secretref:embedding-endpoint \
              phi_4_endpoint=secretref:phi-4-endpoint
